apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantoom-ingress
  namespace: quantoom-root
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "quantoom-server-service"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-PQC-Standard: NIST-FIPS-203-ML-KEM";
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
spec:
  tls:
    - hosts:
        - quantoomroot.io
        - api.quantoomroot.io
      secretName: quantoom-tls-cert
  rules:
    - host: quantoomroot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quantoom-client-service
                port:
                  number: 80
    - host: api.quantoomroot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quantoom-server-service
                port:
                  number: 4000
